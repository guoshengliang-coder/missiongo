# Include inside the host's HTTPS server block. Install these files independently
# of the application containers; replace the one directory placeholder locally.
location = /release-status.json {
    alias <RELEASE_STATUS_DIRECTORY>/status.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}
location ^~ /release-wait/ {
    alias <RELEASE_STATUS_DIRECTORY>/;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;
}
# Also set proxy_intercept_errors on in the existing application proxy location.
error_page 502 503 504 =503 /release-wait/wait.html;

# What may be cached under /maven, stated here rather than left to whatever the CDN
# decides from the file extension. A published version is immutable -- every release
# verifies the older files byte for byte -- so its files can be cached hard. The metadata
# is the opposite: it gains a line on every release, and a cached copy would hide a new
# version from every host. Leaving that to a default extension list made the correctness
# of a release depend on someone else's configuration, and produced a confusing asymmetry
# during an outage: .jar was served from the edge while everything else returned the
# origin's 404.
map $uri $missiongo_maven_cache {
  default "public, max-age=31536000, immutable";
  ~^/maven/.*maven-metadata\.xml "no-cache, no-store, must-revalidate";
}

map $uri $missiongo_content_security_policy {
  default "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; media-src 'self' blob:; object-src 'none'; script-src 'self'; style-src 'self'";
  ~^/oauth/ "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self' https: http://localhost:* http://127.0.0.1:* http://[::1]:*; frame-ancestors 'none'; img-src 'self' data: blob:; media-src 'self' blob:; object-src 'none'; script-src 'self'; style-src 'self'";
}

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 110m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy $missiongo_content_security_policy always;

  location = /health {
    proxy_pass http://server:8787/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_buffering off;
  }

  location /api/ {
    proxy_pass http://server:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location = /mcp {
    proxy_pass http://server:8787/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location ^~ /.well-known/ {
    proxy_pass http://server:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location ^~ /oauth/ {
    proxy_pass http://server:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_buffering off;
  }

  location ^~ /mcp/ {
    return 404;
  }

  location = /index.html {
    include /etc/nginx/missiongo-security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  location = /sw.js {
    include /etc/nginx/missiongo-security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  # Every location below that adds a header of its own includes the shared security
  # headers, because add_header replaces the inherited set rather than merging with it.
  location = /downloads/missiongo-android-latest.apk {
    default_type application/vnd.android.package-archive;
    include /etc/nginx/missiongo-security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Content-Disposition 'attachment; filename="missiongo-android-latest.apk"' always;
    try_files $uri =404;
  }

  # Published AI Skill. Clients install and update from this fixed address, so it must
  # never be cached.
  location = /downloads/missiongo-skill/SKILL.md {
    default_type text/markdown;
    # The Skill is written in Chinese, so the charset must be declared. nginx only
    # appends it for types in charset_types, which does not cover text/markdown.
    charset utf-8;
    charset_types text/markdown;
    include /etc/nginx/missiongo-security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  # Published Android SDK host-integration guide. Same fixed-address contract as the Skill
  # above: a host app is handed this URL, so it must never be cached.
  location = /downloads/missiongo-android-sdk/INTEGRATION.md {
    default_type text/markdown;
    charset utf-8;
    charset_types text/markdown;
    include /etc/nginx/missiongo-security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  # Private Maven repository for the Android feedback SDK. A Gradle client must see a
  # real 404 for an artifact it does not find; the SPA fallback below would answer 200
  # with index.html and turn a missing version into an unreadable parse error. This
  # location deliberately adds no header of its own so it inherits the server-level
  # security headers.
  location ^~ /maven/ {
    # Repeats the server-level security headers because this location adds one of its own;
    # see the note above the download locations.
    include /etc/nginx/missiongo-security-headers.conf;
    add_header Cache-Control $missiongo_maven_cache always;
    try_files $uri =404;
  }

  location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
    expires 7d;
    include /etc/nginx/missiongo-security-headers.conf;
    add_header Cache-Control "public, max-age=604800, immutable" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

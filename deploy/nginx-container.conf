map $uri $missiongo_content_security_policy {
  default "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; media-src 'self' blob:; object-src 'none'; script-src 'self'; style-src 'self'";
  ~^/oauth/ "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self' https: http://localhost:* http://127.0.0.1:* http://[::1]:*; frame-ancestors 'none'; img-src 'self' data: blob:; media-src 'self' blob:; object-src 'none'; script-src 'self'; style-src 'self'";
}

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 110m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy $missiongo_content_security_policy always;

  location = /health {
    proxy_pass http://server:8787/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_buffering off;
  }

  location /api/ {
    proxy_pass http://server:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location = /mcp {
    proxy_pass http://server:8787/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location ^~ /.well-known/ {
    proxy_pass http://server:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location ^~ /oauth/ {
    proxy_pass http://server:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_buffering off;
  }

  location ^~ /mcp/ {
    return 404;
  }

  location = /index.html {
    add_header Cache-Control "no-store";
  }

  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Both download locations below repeat the server-level security headers on purpose:
  # add_header in a location replaces the inherited set rather than merging with it, so
  # a location that adds any header of its own silently drops nosniff and the CSP.
  location = /downloads/missiongo-android-latest.apk {
    default_type application/vnd.android.package-archive;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy $missiongo_content_security_policy always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Content-Disposition 'attachment; filename="missiongo-android-latest.apk"' always;
    try_files $uri =404;
  }

  # Published AI Skill. Clients install and update from this fixed address, so it must
  # never be cached.
  location = /downloads/missiongo-skill/SKILL.md {
    default_type text/markdown;
    # The Skill is written in Chinese, so the charset must be declared. nginx only
    # appends it for types in charset_types, which does not cover text/markdown.
    charset utf-8;
    charset_types text/markdown;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy $missiongo_content_security_policy always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

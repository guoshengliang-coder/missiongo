# The site's security headers, in one place because add_header does not merge: a location
# that adds any header of its own replaces the inherited set entirely, silently dropping
# every one of these. That is easy to miss when adding a Cache-Control to a location, and
# it had already happened to the SPA itself and to every static asset -- the pages the CSP
# exists to protect were the ones being served without it.
#
# Include this from every location that adds a header of its own. Included from outside
# conf.d so nginx does not try to load it as a server block.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy $missiongo_content_security_policy always;

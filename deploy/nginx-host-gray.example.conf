# Example host ingress for a Cloudflare-fronted MissionGo gray origin.
# Replace angle-bracket placeholders locally. Never commit the real origin,
# certificate paths, or upstream address.

# Generate this include from Cloudflare's published IPv4/IPv6 ranges during
# rollout. Only these peers may supply CF-Connecting-IP.
include /etc/nginx/cloudflare-realip.conf;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=missiongo_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=missiongo_connections:10m;

log_format missiongo_gray escape=json
  '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
  '"method":"$request_method","uri":"$uri","status":$status,'
  '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
  '"cf_ray":"$http_cf_ray"}';

server {
  listen 443 ssl http2;
  server_name <GRAY_HOSTNAME>;
  ssl_certificate <CERTIFICATE_PATH>;
  ssl_certificate_key <PRIVATE_KEY_PATH>;

  access_log /var/log/nginx/missiongo-gray.access.log missiongo_gray;
  limit_conn missiongo_connections 40;

  location / {
    limit_req zone=missiongo_api burst=40 nodelay;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID $request_id;
    proxy_pass http://<LOOPBACK_UPSTREAM>;
  }
}
# Load this template from nginx's `http` context: it defines log and limit
# zones in addition to the server block.

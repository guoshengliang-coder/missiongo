openapi: 3.1.0
info:
  title: MissionGo API
  version: 0.1.0
  description: Core REST contract for products, components, work items, and their timelines.
servers: []
security:
  - adminSessionCookie: []
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: ok
  /api/v1/auth/login:
    post:
      operationId: signIn
      summary: Sign in with an email address and password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  format: email
                  maxLength: 254
                  description: The account's email address. Matched case-insensitively.
                password: { type: string, minLength: 1, maxLength: 1024, format: password }
      responses:
        "200":
          description: >-
            Session created. A wrong password, an unknown address and a suspended
            account all answer 401 with the same body, so the form cannot be used
            to find out who has an account here.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/session:
    get:
      operationId: getSession
      security:
        - adminSessionCookie: []
      responses:
        "200":
          description: The signed-in account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/bootstrap:
    get:
      operationId: getBootstrap
      description: >-
        Everything the console needs to draw its first screen, in one request:
        the session, the products, the resolved product, its first page of items
        and its components. It exists to collapse the session -> products ->
        items chain, which cost three round trips before anything could render.
        Every route it composes remains available and unchanged; the console
        still uses them for paging, filtering and product switching.
      security:
        - adminSessionCookie: []
      parameters:
        - in: query
          name: productId
          description: >-
            The product to open. Ignored when it does not exist or is not
            visible, in which case the first product is used.
          schema:
            type: string
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/WorkItemStatus"
        - in: query
          name: type
          schema:
            $ref: "#/components/schemas/WorkItemType"
        - in: query
          name: search
          schema:
            type: string
            maxLength: 200
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: >-
            The first screen. items and components are empty, and productId is
            null, when the workspace has no product yet.
          content:
            application/json:
              schema:
                type: object
                required: [user, products, productId, items, components]
                properties:
                  user:
                    $ref: "#/components/schemas/AuthUser"
                  products:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"
                  productId:
                    type: string
                    nullable: true
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkItem"
                  components:
                    type: array
                    items:
                      $ref: "#/components/schemas/Component"
                  nextBeforeSequence:
                    type: integer
                    minimum: 1
                  summary:
                    type: object
                    required: [total, byStatus]
                    properties:
                      total: { type: integer, minimum: 0 }
                      byStatus:
                        type: object
                        additionalProperties: { type: integer, minimum: 0 }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/logout:
    post:
      operationId: signOut
      security:
        - adminSessionCookie: []
      responses:
        "200":
          description: Browser session cookie cleared.
  /api/v1/auth/password:
    post:
      operationId: changeOwnPassword
      summary: Change your own password.
      description: >-
        The current password is required even though the caller already holds a
        session: a cookie proves the browser was left signed in, not that the
        owner is at it. Succeeding invalidates every other session and AI token
        the account holds, so a replacement cookie comes back with the response.
      security:
        - adminSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, maxLength: 1024, format: password }
                newPassword: { type: string, minLength: 12, maxLength: 1024, format: password }
      responses:
        "200":
          description: Password changed, and this session reissued.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/email:
    post:
      operationId: changeOwnEmail
      summary: Change your own sign-in address.
      description: >-
        The current password is required: the address is what you sign in with,
        so taking it over is taking over the account. Credentials are left alone
        -- an address is an identifier, not a secret -- so other sessions stay
        signed in.
      security:
        - adminSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, email]
              properties:
                currentPassword: { type: string, maxLength: 1024, format: password }
                email: { type: string, format: email, maxLength: 254 }
      responses:
        "200":
          description: Address changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: That email address already has an account.
  /api/v1/ai-authorizations:
    get:
      operationId: listAiAuthorizations
      summary: The AI clients currently authorized against your account.
      description: >-
        Your own only. An administrator manages accounts, but an authorization is
        a credential its owner granted; the administrator's lever is suspending
        the account, which stops all of them at once. Revoked and expired
        authorizations are left out.
      security:
        - adminSessionCookie: []
      responses:
        "200":
          description: Live authorizations, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [authorizations]
                properties:
                  authorizations:
                    type: array
                    items: { $ref: "#/components/schemas/AiAuthorization" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/ai-authorizations/{authorizationId}:
    parameters:
      - name: authorizationId
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: revokeAiAuthorization
      summary: Disconnect one AI client.
      description: >-
        Cuts off this authorization alone; the account's other clients and its
        browser sessions are untouched. The client has to be authorized again to
        come back.
      security:
        - adminSessionCookie: []
      responses:
        "204":
          description: Authorization revoked.
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/products/{productId}/accounts:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    get:
      operationId: listProductAccounts
      summary: Who can reach this product.
      description: >-
        The account-and-product relation read from the product's side.
        Administrators only. Every account is listed, including administrators,
        who are marked as reaching the product by role whatever their row says --
        a list that omitted them would misstate who can open it.
      security:
        - adminSessionCookie: []
      responses:
        "200":
          description: Every account, with its standing on this product.
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items: { $ref: "#/components/schemas/ProductAccessEntry" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: setProductAccounts
      summary: Set who can reach this product.
      description: >-
        Only this product's rows are touched, unlike the account-side editor
        which replaces an account's whole set: from here you cannot see what else
        an account holds, so replacing everything would revoke permissions that
        were never on screen. Clearing all three switches for an account removes
        its row.
      security:
        - adminSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accounts]
              properties:
                accounts:
                  type: array
                  items:
                    type: object
                    required: [accountId]
                    properties:
                      accountId: { type: string }
                      canView: { type: boolean }
                      canOperate: { type: boolean }
                      canUseAi: { type: boolean }
      responses:
        "200":
          description: The stored access list.
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items: { $ref: "#/components/schemas/ProductAccessEntry" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/accounts:
    get:
      operationId: listAccounts
      summary: Every account, with its product permissions.
      description: >-
        Administrators only. A member gets 404 rather than 403, so the endpoint
        does not confirm that account management exists for them to be refused.
      security:
        - adminSessionCookie: []
      responses:
        "200":
          description: The accounts on this deployment.
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items: { $ref: "#/components/schemas/Account" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createAccount
      summary: Create an account and set its first password.
      description: >-
        There is no public sign-up. An administrator creates the account and
        passes on the first password; the owner replaces it from their own
        settings.
      security:
        - adminSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 12, maxLength: 1024, format: password }
                role: { $ref: "#/components/schemas/AccountRole" }
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: That email address already has an account.
  /api/v1/accounts/{accountId}:
    parameters:
      - name: accountId
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateAccount
      summary: Change a role, suspend or restore, or reset a password.
      description: >-
        Suspending and resetting both end every session and AI token the account
        holds. The last active administrator cannot be demoted, which would leave
        nobody able to manage accounts.
      security:
        - adminSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                  description: >-
                    How an account seeded before addresses were required gets a
                    real one -- the bootstrap account keeps whatever
                    ADMIN_USERNAME said.
                role: { $ref: "#/components/schemas/AccountRole" }
                disabled: { type: boolean }
                password: { type: string, minLength: 12, maxLength: 1024, format: password }
      responses:
        "200":
          description: Account updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The last active administrator cannot be removed or demoted.
    delete:
      operationId: deleteAccount
      summary: Delete an account.
      description: >-
        Its sessions end immediately. Products it created stay, with their
        createdByAccountId pointing at an id that no longer resolves -- deleting
        a person must not delete a product and its work items.
      security:
        - adminSessionCookie: []
      responses:
        "204":
          description: Account deleted.
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The last active administrator cannot be removed.
  /api/v1/accounts/{accountId}/products:
    parameters:
      - name: accountId
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: setAccountProducts
      summary: Replace one account's product permissions.
      description: >-
        The whole set is replaced, so a product left out of the list is revoked.
        Operate and AI each imply view, and are stored that way. An administrator
        reaches every product regardless; AI rows are the exception, and bound
        even an administrator's AI clients when present.
      security:
        - adminSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties:
                permissions:
                  type: array
                  items: { $ref: "#/components/schemas/ProductPermission" }
      responses:
        "200":
          description: The stored permissions.
          content:
            application/json:
              schema:
                type: object
                required: [permissions]
                properties:
                  permissions:
                    type: array
                    items: { $ref: "#/components/schemas/ProductPermission" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/products:
    get:
      operationId: listProducts
      responses:
        "200":
          description: Products visible to the current principal.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Product created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /api/v1/sdk-tokens:
    get:
      operationId: listSdkTokens
      responses:
        "200":
          description: SDK token metadata. Token plaintext is never returned after creation.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SdkToken" }
    post:
      operationId: createSdkToken
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSdkTokenRequest" }
      responses:
        "201":
          description: SDK token created. The plaintext token is returned exactly once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedSdkToken" }
  /api/v1/sdk-tokens/{tokenId}:
    parameters:
      - in: path
        name: tokenId
        required: true
        schema: { type: string }
    delete:
      operationId: revokeSdkToken
      responses:
        "200":
          description: SDK token revoked. Repeating the operation is safe.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SdkToken" }
  /api/v1/sdk/drafts:
    post:
      operationId: upsertSdkFeedbackDraft
      security:
        - sdkBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsertFeedbackDraftRequest" }
      responses:
        "201":
          description: Draft created or updated using its client draft ID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackDraft" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/sdk/editor-session:
    post:
      operationId: prepareSdkFeedbackEditor
      description: Creates or updates a feedback draft and issues its 15-minute Web editing session in one request.
      security:
        - sdkBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsertFeedbackDraftRequest" }
      responses:
        "201":
          description: Draft and draft-scoped Web session created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreparedFeedbackEditor" }
        "200":
          description: The idempotent draft was already submitted, so no editing session is issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackDraft" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/sdk/drafts/{draftId}:
    parameters:
      - $ref: "#/components/parameters/FeedbackDraftId"
    get:
      operationId: getSdkFeedbackDraft
      security:
        - sdkBearerAuth: []
        - feedbackSessionCookie: []
      responses:
        "200":
          description: The draft scoped to the current SDK token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackDraft" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    patch:
      operationId: updateSdkFeedbackDraft
      description: Updates editable draft fields using either its SDK bearer token or draft-scoped Web session cookie.
      security:
        - sdkBearerAuth: []
        - feedbackSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateFeedbackDraftRequest" }
      responses:
        "200":
          description: Draft updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackDraft" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/sdk/drafts/{draftId}/finalize:
    parameters:
      - $ref: "#/components/parameters/FeedbackDraftId"
    post:
      operationId: finalizeSdkFeedbackDraft
      security:
        - sdkBearerAuth: []
        - feedbackSessionCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  enum: [inbox, ready]
                  default: inbox
      responses:
        "200":
          description: Draft submitted as a work item. Repeating the request returns the same item key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackDraft" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/sdk/drafts/{draftId}/web-session:
    parameters:
      - $ref: "#/components/parameters/FeedbackDraftId"
    post:
      operationId: createFeedbackWebSession
      description: Creates a 15-minute credential scoped to one active draft. Plaintext is returned only once.
      security:
        - sdkBearerAuth: []
      responses:
        "200":
          description: Draft-scoped Web session created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackWebSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/sdk/drafts/{draftId}/attachments:
    parameters:
      - $ref: "#/components/parameters/FeedbackDraftId"
    post:
      operationId: uploadSdkFeedbackAttachment
      description: Uploads one attachment to the work item created from this submitted draft. Maximum 10 attachments per item.
      security:
        - sdkBearerAuth: []
        - feedbackSessionCookie: []
      parameters:
        - in: header
          name: X-MissionGo-Filename
          required: true
          schema: { type: string }
        - in: header
          name: X-MissionGo-Content-Type
          required: true
          schema: { type: string }
        - in: header
          name: X-MissionGo-Client-Attachment-ID
          required: true
          description: URL-safe idempotency key for this attachment within the draft.
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,100}$" }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Attachment uploaded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkItemAttachment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/products/{productId}/icon:
    get:
      operationId: getProductIcon
      description: >-
        The product icon as a PNG. Served separately from the product listing so
        the listing stays small enough not to delay the console's first paint,
        and so the browser can cache the image across cold starts. The ETag
        follows the product's updatedAt, which callers can also use as a cache
        buster.
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The icon, re-encoded as a 96x96 PNG.
          headers:
            ETag:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
          content:
            image/png:
              schema:
                type: string
                format: binary
        "304":
          description: The caller's cached copy is still current.
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/products/{productId}/components:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    get:
      operationId: listComponents
      responses:
        "200":
          description: Components in the product.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Component"
    post:
      operationId: createComponent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateComponentRequest"
      responses:
        "201":
          description: Component created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Component"
  /api/v1/items:
    get:
      operationId: listItems
      parameters:
        - in: query
          name: productId
          required: true
          schema:
            type: string
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/WorkItemStatus"
        - in: query
          name: type
          schema:
            $ref: "#/components/schemas/WorkItemType"
        - in: query
          name: search
          description: Case-insensitive search across item ID, title, and description.
          schema:
            type: string
            maxLength: 200
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: beforeSequence
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Work items ordered by newest product sequence first.
          content:
            application/json:
              schema:
                type: object
                required: [items, summary]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkItem"
                  nextBeforeSequence:
                    type: integer
                    minimum: 1
                  summary:
                    type: object
                    required: [total, byStatus]
                    properties:
                      total: { type: integer, minimum: 0 }
                      byStatus:
                        type: object
                        additionalProperties: { type: integer, minimum: 0 }
    post:
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkItemRequest"
      responses:
        "201":
          description: Work item created as a draft or ready for processing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItem"
  /api/v1/items/{itemKey}:
    parameters:
      - $ref: "#/components/parameters/WorkItemKey"
    get:
      operationId: getItem
      responses:
        "200":
          description: Complete work-item context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItem"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkItemRequest"
      responses:
        "200":
          description: Work item updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItem"
  /api/v1/items/{itemKey}/transitions:
    parameters:
      - $ref: "#/components/parameters/WorkItemKey"
    post:
      operationId: transitionItem
      description: Applies a human transition through the authoritative domain state machine.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionWorkItemRequest"
      responses:
        "200":
          description: State transition recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItem"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/items/{itemKey}/timeline:
    parameters:
      - $ref: "#/components/parameters/WorkItemKey"
    get:
      operationId: getItemTimeline
      responses:
        "200":
          description: >-
            The work item's history: immutable events merged with comments, in
            the order they happened. Comments appear as entries whose eventType
            is comment_added. Withdrawn comments are included here so a reader
            can see that something was said and taken back.
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkItemEvent"
  /api/v1/items/{itemKey}/comments:
    parameters:
      - $ref: "#/components/parameters/WorkItemKey"
    get:
      operationId: listItemComments
      responses:
        "200":
          description: Comments on the work item, withdrawn ones included and marked.
          content:
            application/json:
              schema:
                type: object
                required: [comments]
                properties:
                  comments:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkItemComment"
    post:
      operationId: createItemComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkItemComment"
      responses:
        "201":
          description: The stored comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemComment"
        "400":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/items/{itemKey}/comments/{commentId}/withdraw:
    parameters:
      - $ref: "#/components/parameters/WorkItemKey"
      - name: commentId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: withdrawItemComment
      description: >-
        Take a comment down without deleting it. Only a person can withdraw, and
        an agent cannot withdraw its own: an AI rereads an item before it acts,
        so a wrong analysis has to be retractable, but deleting is the one
        irreversible action here and it stays with the human.
      responses:
        "200":
          description: The withdrawn comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemComment"
        "409":
          description: The comment was already withdrawn.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/items/{itemKey}/attachments:
    parameters:
      - $ref: "#/components/parameters/WorkItemKey"
    get:
      operationId: listItemAttachments
      responses:
        "200":
          description: Attachment metadata for the work item.
          content:
            application/json:
              schema:
                type: object
                required: [attachments]
                properties:
                  attachments:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkItemAttachment"
    post:
      operationId: uploadItemAttachment
      description: Uploads one allowlisted image, video, or log file as a binary body.
      parameters:
        - in: header
          name: X-MissionGo-Filename
          required: true
          description: URL-encoded original filename without a directory path.
          schema: { type: string }
        - in: header
          name: X-MissionGo-Content-Type
          required: true
          description: Original media type. The request Content-Type remains application/octet-stream.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Attachment stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemAttachment"
  /api/v1/items/{itemKey}/attachments/{attachmentId}:
    parameters:
      - $ref: "#/components/parameters/WorkItemKey"
      - in: path
        name: attachmentId
        required: true
        schema: { type: string }
    delete:
      operationId: deleteItemAttachment
      responses:
        "204":
          description: Attachment metadata and stored content deleted.
  /api/v1/items/{itemKey}/attachments/{attachmentId}/content:
    parameters:
      - $ref: "#/components/parameters/WorkItemKey"
      - in: path
        name: attachmentId
        required: true
        schema: { type: string }
    get:
      operationId: downloadItemAttachment
      parameters:
        - in: header
          name: Range
          description: Optional single byte range, for example bytes=0-65535.
          schema: { type: string }
      responses:
        "200":
          description: Authenticated attachment content using its recorded media type.
        "206":
          description: Requested attachment byte range.
        "416":
          description: Requested byte range is invalid or outside the attachment.
components:
  securitySchemes:
    adminSessionCookie:
      type: apiKey
      in: cookie
      name: missiongo_session
      description: Signed, HTTP-only administrator browser session.
    bearerAuth:
      type: http
      scheme: bearer
    sdkBearerAuth:
      type: http
      scheme: bearer
      description: Product-scoped Android submission token. It does not grant management or read access.
    feedbackSessionCookie:
      type: apiKey
      in: cookie
      name: missiongo_feedback_session
      description: Short-lived session scoped to one feedback draft.
  parameters:
    ProductId:
      in: path
      name: productId
      required: true
      schema:
        type: string
    WorkItemKey:
      in: path
      name: itemKey
      required: true
      schema:
        type: string
        pattern: "^[A-Z][A-Z0-9]{1,9}-[1-9][0-9]*$"
    FeedbackDraftId:
      in: path
      name: draftId
      required: true
      schema: { type: string }
  responses:
    ValidationFailed:
      description: The request body failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Authentication is missing, invalid, expired, or revoked.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The requested operation conflicts with current state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: The applicable request or sign-in attempt limit has been reached.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    AuthSession:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/AuthUser" }
    AuthUser:
      type: object
      required: [id, username, role]
      properties:
        id: { type: string }
        username:
          type: string
          format: email
          description: The email address this account signs in with.
        role: { $ref: "#/components/schemas/AccountRole" }
    AccountRole:
      type: string
      enum: [admin, member]
      description: >-
        An administrator reaches every product and manages accounts. A member
        reaches only what it was granted, and can create products and archive the
        ones it created.
    ProductPermission:
      type: object
      required: [productId, canView, canOperate, canUseAi]
      description: >-
        Three independent switches, not a ranked scale: an account can be allowed
        to read a product in the console without its AI clients getting the same
        reach. Operate and AI each imply view when stored.
      properties:
        productId: { type: string }
        canView: { type: boolean }
        canOperate: { type: boolean }
        canUseAi: { type: boolean }
    AiAuthorization:
      type: object
      required: [id, clientId, scopes, issuedAt, expiresAt]
      properties:
        id: { type: string }
        clientId:
          type: string
          description: The signed OAuth client id the token was issued to.
        clientName:
          type: string
          description: The client's registered name, decoded from its signed id when still readable.
        scopes:
          type: array
          items: { type: string }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        lastUsedAt:
          type: string
          format: date-time
          description: >-
            Written at most once every five minutes, so reading through MCP does
            not cost a database write per call. Absent until first use.
    ProductAccessEntry:
      type: object
      required: [account, permission, reachesByRole]
      properties:
        account: { $ref: "#/components/schemas/Account" }
        permission: { $ref: "#/components/schemas/ProductPermission" }
        reachesByRole:
          type: boolean
          description: True for an administrator, who reaches the product whatever the row says.
    Account:
      type: object
      required: [id, email, role, createdAt, updatedAt, permissions]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/AccountRole" }
        disabledAt:
          type: string
          format: date-time
          description: Set while the account is suspended. Its sessions and AI tokens stop working.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/ProductPermission" }
    Product:
      type: object
      required: [id, keyPrefix, name, createdAt, updatedAt, hasIcon]
      properties:
        id: { type: string }
        keyPrefix: { type: string, pattern: "^[A-Z][A-Z0-9]{1,9}$" }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        archivedAt: { type: string, format: date-time }
        createdByAccountId:
          type: string
          description: >-
            The account that created it, and the only non-administrator allowed
            to archive it. Absent on a product that predates accounts, or one
            created through the deployment's operator token.
        hasIcon:
          type: boolean
          description: >-
            Whether an icon has been uploaded. The image itself is not inlined
            here; fetch it from GET /api/v1/products/{productId}/icon, which the
            browser can cache. False means the generated badge is used.
    CreateProductRequest:
      type: object
      required: [name, keyPrefix]
      properties:
        name: { type: string, minLength: 1 }
        keyPrefix: { type: string, pattern: "^[A-Za-z][A-Za-z0-9]{1,9}$" }
    ComponentKind:
      enum: [android, macos, web, server, shared, other]
    Component:
      type: object
      required: [id, productId, name, kind, createdAt, updatedAt]
      properties:
        id: { type: string }
        productId: { type: string }
        name: { type: string }
        kind: { $ref: "#/components/schemas/ComponentKind" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateComponentRequest:
      type: object
      required: [name, kind]
      properties:
        name: { type: string, minLength: 1 }
        kind: { $ref: "#/components/schemas/ComponentKind" }
    WorkItemType:
      enum: [idea, requirement, bug, task, note]
    WorkItemPriority:
      enum: [urgent, high, normal, low]
    WorkItemStatus:
      enum: [inbox, ready, in_progress, on_hold, pending_verification, done, cancelled]
    WorkItemReport:
      type: object
      required: [overview]
      properties:
        overview: { type: string, maxLength: 20000 }
        reproductionSteps: { type: string, maxLength: 20000 }
        expectedOutcome: { type: string, maxLength: 20000 }
        impact: { type: string, maxLength: 10000 }
        occurrenceFrequency: { enum: [unknown, once, intermittent, frequent, always] }
    WorkItemEnvironment:
      type: object
      required: [platform]
      properties:
        platform: { enum: [android, macos, web, server, shared, other] }
        appVersion: { type: string }
        buildNumber: { type: string }
        sourceRevision: { type: string }
        osVersion: { type: string }
        deviceModel: { type: string }
        metadata:
          type: object
          additionalProperties: { type: string }
    WorkItem:
      type: object
      required: [id, key, productId, affectedComponentIds, type, priority, status, title, description, diagnosticSummary, attachments, createdAt, updatedAt]
      properties:
        id: { type: string }
        key: { type: string }
        productId: { type: string }
        sourceComponentId: { type: string }
        affectedComponentIds:
          type: array
          uniqueItems: true
          items: { type: string }
        areaId: { type: string }
        type: { $ref: "#/components/schemas/WorkItemType" }
        priority: { $ref: "#/components/schemas/WorkItemPriority" }
        status: { $ref: "#/components/schemas/WorkItemStatus" }
        title: { type: string }
        description: { type: string }
        report: { $ref: "#/components/schemas/WorkItemReport" }
        diagnosticSummary:
          type: object
          required: [logCount, contextEntryCount]
          properties:
            logCount: { type: integer, minimum: 0 }
            contextEntryCount: { type: integer, minimum: 0 }
        environment: { $ref: "#/components/schemas/WorkItemEnvironment" }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/WorkItemAttachment" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateWorkItemRequest:
      type: object
      required: [productId, type, priority, title, description, environment]
      properties:
        productId: { type: string }
        status:
          enum: [inbox, ready]
          default: inbox
        sourceComponentId: { type: string }
        affectedComponentIds:
          type: array
          uniqueItems: true
          items: { type: string }
        areaId: { type: string }
        type: { $ref: "#/components/schemas/WorkItemType" }
        priority: { $ref: "#/components/schemas/WorkItemPriority" }
        title: { type: string, minLength: 1 }
        description: { type: string }
        report: { $ref: "#/components/schemas/WorkItemReport" }
        environment: { $ref: "#/components/schemas/WorkItemEnvironment" }
    SdkToken:
      type: object
      required: [id, name, productId, platform, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        productId: { type: string }
        platform: { const: android }
        sourceComponentId: { type: string }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    CreatedSdkToken:
      allOf:
        - $ref: "#/components/schemas/SdkToken"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              pattern: "^mg_sdk_[A-Za-z0-9_-]{43}$"
              description: Plaintext credential shown only in this response.
    CreateSdkTokenRequest:
      type: object
      required: [name, productId]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        productId: { type: string }
        sourceComponentId: { type: string }
        expiresAt: { type: string, format: date-time }
    FeedbackLogEntry:
      type: object
      required: [timestamp, level, message]
      properties:
        timestamp: { type: string, format: date-time }
        level: { enum: [debug, info, warn, error] }
        message: { type: string, minLength: 1, maxLength: 4000 }
        attributes:
          type: object
          maxProperties: 20
          additionalProperties: { type: string, maxLength: 1000 }
    UpsertFeedbackDraftRequest:
      type: object
      required: [clientDraftId, environment]
      properties:
        clientDraftId:
          type: string
          pattern: "^[A-Za-z0-9_-]{8,100}$"
        type:
          allOf: [{ $ref: "#/components/schemas/WorkItemType" }]
          default: bug
        priority:
          allOf: [{ $ref: "#/components/schemas/WorkItemPriority" }]
          default: normal
        title: { type: string, maxLength: 500 }
        description: { type: string, maxLength: 20000 }
        environment: { $ref: "#/components/schemas/WorkItemEnvironment" }
        context:
          type: object
          maxProperties: 50
          additionalProperties: { type: string, maxLength: 2000 }
        logs:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/FeedbackLogEntry" }
    FeedbackDraft:
      type: object
      required: [id, clientDraftId, productId, status, type, priority, title, description, environment, context, logs, expiresAt, createdAt, updatedAt]
      properties:
        id: { type: string }
        clientDraftId: { type: string }
        productId: { type: string }
        sourceComponentId: { type: string }
        status: { enum: [editing, submitted, expired] }
        type: { $ref: "#/components/schemas/WorkItemType" }
        priority: { $ref: "#/components/schemas/WorkItemPriority" }
        title: { type: string }
        description: { type: string }
        environment: { $ref: "#/components/schemas/WorkItemEnvironment" }
        context:
          type: object
          additionalProperties: { type: string }
        logs:
          type: array
          items: { $ref: "#/components/schemas/FeedbackLogEntry" }
        itemKey: { type: string }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UpdateFeedbackDraftRequest:
      type: object
      minProperties: 1
      properties:
        type: { $ref: "#/components/schemas/WorkItemType" }
        priority: { $ref: "#/components/schemas/WorkItemPriority" }
        title: { type: string, maxLength: 500 }
        description: { type: string, maxLength: 20000 }
        environment: { $ref: "#/components/schemas/WorkItemEnvironment" }
        context:
          type: object
          maxProperties: 50
          additionalProperties: { type: string, maxLength: 2000 }
        logs:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/FeedbackLogEntry" }
    FeedbackWebSession:
      type: object
      required: [token, expiresAt]
      properties:
        token:
          type: string
          pattern: "^mg_ws_[A-Za-z0-9_-]{43}$"
        expiresAt: { type: string, format: date-time }
    PreparedFeedbackEditor:
      allOf:
        - $ref: "#/components/schemas/FeedbackDraft"
        - type: object
          required: [sessionToken, sessionExpiresAt]
          properties:
            sessionToken:
              type: string
              pattern: "^mg_ws_[A-Za-z0-9_-]{43}$"
            sessionExpiresAt: { type: string, format: date-time }
    UpdateWorkItemRequest:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        report: { $ref: "#/components/schemas/WorkItemReport" }
        type: { $ref: "#/components/schemas/WorkItemType" }
        priority: { $ref: "#/components/schemas/WorkItemPriority" }
        environment:
          oneOf:
            - $ref: "#/components/schemas/WorkItemEnvironment"
            - type: "null"
        affectedComponentIds:
          type: array
          uniqueItems: true
          items: { type: string }
    WorkItemAttachment:
      type: object
      required: [id, itemKey, kind, displayNumber, filename, contentType, sizeBytes, createdAt]
      properties:
        id: { type: string }
        itemKey: { type: string }
        kind: { enum: [image, video, log] }
        displayNumber: { type: integer, minimum: 1 }
        filename: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
    TransitionWorkItemRequest:
      type: object
      required: [to, reason]
      properties:
        to: { $ref: "#/components/schemas/WorkItemStatus" }
        reason:
          enum: [triaged, claim, request_human_input, resume, resolution_submitted, verification_passed, verification_failed, lease_expired, released, cancelled, reopened, restored]
        note: { type: string }
    WorkItemEvent:
      type: object
      required: [id, itemKey, eventType, actorKind, payload, createdAt]
      properties:
        id: { type: string }
        itemKey: { type: string }
        eventType: { type: string }
        actorKind: { enum: [human, agent, system] }
        fromStatus: { $ref: "#/components/schemas/WorkItemStatus" }
        toStatus: { $ref: "#/components/schemas/WorkItemStatus" }
        payload:
          type: object
          additionalProperties: true
        accountId:
          type: string
          description: Which account authorized an agent's write. Absent on human events.
        clientId:
          type: string
          description: Which OAuth client an agent wrote through.
        executionId: { type: string }
        createdAt: { type: string, format: date-time }
    WorkItemComment:
      type: object
      required: [id, itemKey, actorKind, bodyKind, body, createdAt]
      properties:
        id: { type: string }
        itemKey: { type: string }
        actorKind: { enum: [human, agent, system] }
        bodyKind: { enum: [structured, free] }
        body:
          oneOf:
            - $ref: "#/components/schemas/StructuredCommentBody"
            - $ref: "#/components/schemas/FreeCommentBody"
        accountId: { type: string }
        clientId: { type: string }
        executionId: { type: string }
        createdAt: { type: string, format: date-time }
        withdrawnAt: { type: string, format: date-time }
        withdrawnBy: { type: string }
    StructuredCommentBody:
      type: object
      description: >-
        An analysis of any work-item type, not just a bug. MissionGo holds ideas,
        requirements, tasks and notes too, where "root cause" is not the question
        to answer; what all five share is what was understood, what was found,
        and what could not be settled without the user.
      required: [understanding, finding, evidence, openQuestions]
      properties:
        understanding: { type: string, maxLength: 20000 }
        finding: { type: string, maxLength: 20000 }
        evidence:
          type: array
          minItems: 1
          items: { type: string, maxLength: 2000 }
          maxItems: 50
        proposal: { type: string, maxLength: 20000 }
        openQuestions:
          type: array
          items: { type: string, maxLength: 2000 }
          maxItems: 50
        agentName: { type: string, maxLength: 100 }
    FreeCommentBody:
      type: object
      required: [text]
      properties:
        text: { type: string, maxLength: 20000 }
    CreateWorkItemComment:
      type: object
      description: >-
        Omit bodyKind for a free-text comment. A structured comment takes the
        conclusion, evidence and risks fields instead of text.
      properties:
        bodyKind: { enum: [structured, free] }
        text: { type: string, maxLength: 20000 }
        understanding: { type: string, maxLength: 20000 }
        finding: { type: string, maxLength: 20000 }
        evidence:
          type: array
          items: { type: string, maxLength: 2000 }
          maxItems: 50
        proposal: { type: string, maxLength: 20000 }
        openQuestions:
          type: array
          items: { type: string, maxLength: 2000 }
          maxItems: 50
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }

openapi: 3.1.0
info:
  title: MissionGo API
  version: 0.0.0
  description: Initial Phase 0 REST contract. Domain actions are intentionally narrow.
servers: []
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: ok
  /api/v1/products:
    get:
      operationId: listProducts
      responses:
        "200":
          description: Products visible to the current principal.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /api/v1/items:
    get:
      operationId: listItems
      parameters:
        - in: query
          name: productId
          required: true
          schema:
            type: string
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/WorkItemStatus"
      responses:
        "200":
          description: Paginated work-item summary list.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkItem"
                  nextCursor:
                    type: [string, "null"]
    post:
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkItemRequest"
      responses:
        "201":
          description: Work item created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItem"
  /api/v1/items/{itemKey}:
    get:
      operationId: getItem
      parameters:
        - $ref: "#/components/parameters/WorkItemKey"
      responses:
        "200":
          description: Complete work-item context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItem"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/items/{itemKey}/verification:
    post:
      operationId: verifyItem
      parameters:
        - $ref: "#/components/parameters/WorkItemKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, note]
              properties:
                outcome:
                  enum: [passed, failed]
                note:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: Verification recorded and work-item state updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    WorkItemKey:
      in: path
      name: itemKey
      required: true
      schema:
        type: string
        pattern: "^[A-Z][A-Z0-9]{1,9}-[1-9][0-9]*$"
  responses:
    NotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Product:
      type: object
      required: [id, keyPrefix, name]
      properties:
        id:
          type: string
        keyPrefix:
          type: string
          pattern: "^[A-Z][A-Z0-9]{1,9}$"
        name:
          type: string
    WorkItemStatus:
      enum:
        - inbox
        - ready
        - in_progress
        - on_hold
        - pending_verification
        - done
        - cancelled
    WorkItem:
      type: object
      required: [id, key, productId, type, priority, status, title, description, affectedComponentIds]
      properties:
        id:
          type: string
        key:
          type: string
        productId:
          type: string
        sourceComponentId:
          type: string
        affectedComponentIds:
          type: array
          items:
            type: string
        type:
          enum: [idea, requirement, bug, task, note]
        priority:
          enum: [urgent, high, normal, low]
        status:
          $ref: "#/components/schemas/WorkItemStatus"
        title:
          type: string
        description:
          type: string
    CreateWorkItemRequest:
      type: object
      required: [productId, type, priority, title, description]
      properties:
        productId:
          type: string
        sourceComponentId:
          type: string
        affectedComponentIds:
          type: array
          items:
            type: string
        areaId:
          type: string
        type:
          enum: [idea, requirement, bug, task, note]
        priority:
          enum: [urgent, high, normal, low]
        title:
          type: string
          minLength: 1
        description:
          type: string
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string

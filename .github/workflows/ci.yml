name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Regenerating the interface baselines is a deliberate act: run this workflow
  # by hand, download the `ui-snapshots` artifact, and commit what changed.
  workflow_dispatch:
    inputs:
      update_ui_snapshots:
        description: Rewrite the UI screenshot baselines and upload them
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  web-and-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run check

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      # The headless shell only; the full browsers are 300MB this job never uses.
      - run: npx playwright install --with-deps chromium
      - run: npm run build:types
      # Measured checks first: they say what is wrong, while a screenshot only
      # says that something is.
      - run: npm run test:ui
      - name: Compare screenshots
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: npm run test:ui:visual
      - name: Rewrite screenshot baselines
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_ui_snapshots }}
        run: npm run test:ui:visual -- --update-snapshots
      - uses: actions/upload-artifact@v5
        if: ${{ always() }}
        with:
          name: ui-snapshots
          path: |
            tests/ui/visual.spec.ts-snapshots/
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # platform-tools only. The action installs "tools platform-tools" by
      # default, and Google has withdrawn the obsolete "tools" package from the
      # SDK repository, so the default now fails every run before any of this
      # repository's code is reached. Gradle downloads the platform and
      # build-tools it needs by itself.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
      - name: Test SDK and build Android apps
        working-directory: sdks/android-feedback
        run: >-
          ./gradlew
          :missiongo-feedback:testDebugUnitTest
          :missiongo-android-app:testDebugUnitTest
          :sample:assembleDebug
          :missiongo-android-app:assembleDebug

  # The macOS client. Tests run on every change, and the bundle is assembled the
  # same way the publish script does it, so a change that breaks packaging fails
  # here rather than on the machine that happens to publish next.
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - name: Test the macOS client
        run: swift test --package-path apps/macos
      - name: Build the app bundle
        run: ./scripts/build-macos-app.sh

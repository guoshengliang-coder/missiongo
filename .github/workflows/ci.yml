name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # A daily full run refreshes native baseline evidence, independent of PRs.
    - cron: "17 19 * * *"
  # Regenerating the interface baselines is a deliberate act: run this workflow
  # by hand, download the `ui-snapshots` artifact, and commit what changed.
  workflow_dispatch:
    inputs:
      update_ui_snapshots:
        description: Rewrite the UI screenshot baselines and upload them
        type: boolean
        default: false

permissions:
  contents: read

# Superseded PR revisions cannot become the version we merge. Keep main and
# manual runs in separate groups so a newer commit cannot cancel release proof.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ui-plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      audit: ${{ steps.plan.outputs.audit }}
      visual: ${{ steps.plan.outputs.visual }}
      shards: ${{ steps.plan.outputs.shards }}
      playwright_image: ${{ steps.playwright.outputs.image }}
      platform_plan: ${{ steps.plan.outputs.platform_plan }}
      android_required: ${{ steps.plan.outputs.android_required }}
      macos_required: ${{ steps.plan.outputs.macos_required }}
      linux_required: ${{ steps.plan.outputs.linux_required }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The planner verifies base ancestry. Fetching the base object alone
          # does not reconnect a depth-1 checkout's shallow merge commit.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Select matching Playwright image
        id: playwright
        # Preserve the Ubuntu 26 environment used by the existing Linux baselines.
        run: echo "image=mcr.microsoft.com/playwright:v$(node -p 'require("playwright-core/package.json").version')-resolute" >> "$GITHUB_OUTPUT"
      - name: Fetch the PR base
        if: github.event_name == 'pull_request'
        # Missing comparison evidence makes the planner choose full UI.
        continue-on-error: true
        env:
          UI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags origin "$UI_BASE_SHA"
      - name: Select UI coverage
        id: plan
        env:
          UI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          UI_UPDATE_SNAPSHOTS: ${{ github.event_name == 'workflow_dispatch' && inputs.update_ui_snapshots }}
        run: node scripts/ui-test-plan.mjs

  linux-node-build:
    needs: ui-plan
    if: needs.ui-plan.outputs.linux_required == 'true'
    name: linux-node (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run build:types
      - run: npm run test --workspace @missiongo/node-workspace
      - name: Install npm package and verify user service
        run: node scripts/test-node-install.mjs

  web-and-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run check

  # Each shard has its own server, database and account. Keep one worker per
  # runner: tests intentionally exercise account-wide notifications/settings.
  ui-audit:
    needs: ui-plan
    if: needs.ui-plan.outputs.audit == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.ui-plan.outputs.shards) }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.ui-plan.outputs.playwright_image }}
      options: --init --ipc=host --mount type=bind,source=/usr/share/fonts/truetype/dejavu,target=/usr/share/fonts/truetype/dejavu,readonly
    env:
      TZ: UTC
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Trust this checkout inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Preserve the runner's baseline monospace font
        run: |
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf
          fc-cache -f /usr/share/fonts/truetype/dejavu
          test "$(fc-match -f '%{family}' monospace)" = "DejaVu Sans Mono"
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run build:types
      - name: Audit interface behavior
        env:
          UI_TEST_PLAN: ${{ needs.ui-plan.outputs.plan }}
          UI_SHARD: ${{ matrix.shard }}
          UI_TIMING_KIND: audit
        run: node scripts/run-ui-tests.mjs --kind=audit --shard="$UI_SHARD"
      - name: Upload UI timing data
        uses: actions/upload-artifact@v5
        if: ${{ always() }}
        with:
          name: ci-timing-${{ github.run_attempt }}-audit-${{ matrix.shard }}
          path: ci-timings/ui-audit-*.json
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v5
        if: ${{ always() }}
        with:
          name: ui-audit-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Capture against a fresh fixture, independently of the behavior shards.
  ui-visual:
    needs: ui-plan
    if: needs.ui-plan.outputs.visual == 'true'
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.ui-plan.outputs.playwright_image }}
      options: --init --ipc=host --mount type=bind,source=/usr/share/fonts/truetype/dejavu,target=/usr/share/fonts/truetype/dejavu,readonly
    env:
      TZ: UTC
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Trust this checkout inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Preserve the runner's baseline monospace font
        run: |
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf
          fc-cache -f /usr/share/fonts/truetype/dejavu
          test "$(fc-match -f '%{family}' monospace)" = "DejaVu Sans Mono"
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run build:types
      - name: Compare or explicitly update screenshots
        env:
          UI_TEST_PLAN: ${{ needs.ui-plan.outputs.plan }}
          UI_TIMING_KIND: visual
        run: node scripts/run-ui-tests.mjs --kind=visual
      - name: Upload UI timing data
        uses: actions/upload-artifact@v5
        if: ${{ always() }}
        with:
          name: ci-timing-${{ github.run_attempt }}-visual
          path: ci-timings/ui-visual-*.json
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v5
        if: ${{ always() }}
        with:
          name: ui-snapshots
          path: |
            tests/ui/visual.spec.ts-snapshots/
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Preserve the required check name used by branch/release gates. A failed,
  # cancelled or unexpectedly skipped shard must never produce a green `ui`.
  ui:
    if: ${{ always() }}
    needs: [ui-plan, ui-audit, ui-visual]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - name: Require all UI checks
        env:
          UI_TEST_PLAN: ${{ needs.ui-plan.outputs.plan }}
          UI_PLAN_RESULT: ${{ needs.ui-plan.result }}
          UI_AUDIT_RESULT: ${{ needs.ui-audit.result }}
          UI_VISUAL_RESULT: ${{ needs.ui-visual.result }}
          UI_UPDATE_SNAPSHOTS: ${{ github.event_name == 'workflow_dispatch' && inputs.update_ui_snapshots }}
        run: node scripts/run-ui-tests.mjs --kind=check

  android-build:
    needs: ui-plan
    if: needs.ui-plan.outputs.android_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # platform-tools only. The action installs "tools platform-tools" by
      # default, and Google has withdrawn the obsolete "tools" package from the
      # SDK repository, so the default now fails every run before any of this
      # repository's code is reached. Gradle downloads the platform and
      # build-tools it needs by itself.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
      - name: Test SDK and build Android apps
        working-directory: sdks/android-feedback
        run: >-
          ./gradlew
          :missiongo-feedback:testDebugUnitTest
          :missiongo-android-app:testDebugUnitTest
          :sample:assembleDebug
          :missiongo-android-app:assembleDebug

  # The macOS client. Impact-selected PR/main runs and full scheduled/manual runs
  # assemble the bundle the
  # same way the publish script does it, so a change that breaks packaging fails
  # here rather than on the machine that happens to publish next.
  macos-build:
    needs: ui-plan
    if: needs.ui-plan.outputs.macos_required == 'true'
    runs-on: macos-15
    # Hung tests have exhausted the default six-hour job limit. Keep ample
    # headroom for cold builds while bounding the release-blocking failure.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - name: Identify Swift build cache
        id: swift-key
        run: node scripts/macos-ci-cache.mjs key
      - name: Restore Swift build cache
        id: swift-cache
        uses: actions/cache/restore@v6
        with:
          path: apps/macos/.build
          key: ${{ steps.swift-key.outputs.key }}
          restore-keys: ${{ steps.swift-key.outputs.prefix }}
      - name: Restore unchanged build input timestamps
        run: node scripts/macos-ci-cache.mjs restore
      - name: Test the macOS client
        timeout-minutes: 18
        run: python3 scripts/macos-ci-watchdog.py --output ci-diagnostics/macos-tests -- swift test --package-path apps/macos
      - name: Build the app bundle
        timeout-minutes: 18
        run: python3 scripts/macos-ci-watchdog.py --output ci-diagnostics/macos-build -- ./scripts/build-macos-app.sh
      - name: Upload macOS diagnostics
        if: ${{ always() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@v5
        with:
          name: macos-diagnostics-${{ github.run_attempt }}
          path: ci-diagnostics/
          retention-days: 7
          if-no-files-found: warn
      - name: Snapshot Swift build inputs
        if: github.event_name != 'pull_request' && steps.swift-cache.outputs.cache-hit != 'true'
        run: node scripts/macos-ci-cache.mjs snapshot
      - name: Save successful Swift build cache
        if: github.event_name != 'pull_request' && steps.swift-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: apps/macos/.build
          key: ${{ steps.swift-key.outputs.key }}

  # Stable check names for branch/release gates. A planned skip must match the
  # build's exact outcome; failed/cancelled/missing planning never earns green.
  android:
    if: ${{ always() }}
    needs: [ui-plan, android-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - name: Require Android result
        env:
          CI_PLATFORM_PLAN: ${{ needs.ui-plan.outputs.platform_plan }}
          CI_PLAN_RESULT: ${{ needs.ui-plan.result }}
          CI_BUILD_RESULT: ${{ needs.android-build.result }}
        run: node scripts/ci-platform-plan.mjs android

  macos:
    if: ${{ always() }}
    needs: [ui-plan, macos-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - name: Require macOS result
        env:
          CI_PLATFORM_PLAN: ${{ needs.ui-plan.outputs.platform_plan }}
          CI_PLAN_RESULT: ${{ needs.ui-plan.result }}
          CI_BUILD_RESULT: ${{ needs.macos-build.result }}
        run: node scripts/ci-platform-plan.mjs macos

  linux-node:
    if: ${{ always() }}
    needs: [ui-plan, linux-node-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - name: Require Linux result
        env:
          CI_PLATFORM_PLAN: ${{ needs.ui-plan.outputs.platform_plan }}
          CI_PLAN_RESULT: ${{ needs.ui-plan.result }}
          CI_BUILD_RESULT: ${{ needs.linux-node-build.result }}
        run: node scripts/ci-platform-plan.mjs linuxNode

  # Diagnostic data only. Existing build/UI gate names and checks stay intact.
  ci-timing-report:
    if: ${{ always() }}
    needs: [ui-plan, ui, android, macos, linux-node, web-and-server]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - name: Download timing data for this attempt
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          pattern: ci-timing-${{ github.run_attempt }}-*
          path: ci-timings
          merge-multiple: true
      - name: Summarize CI timings
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UI_TEST_PLAN: ${{ needs.ui-plan.outputs.plan }}
        run: node scripts/ci-timing-report.mjs
      - uses: actions/upload-artifact@v5
        if: ${{ always() }}
        with:
          name: ci-timing-summary-${{ github.run_attempt }}
          path: ci-timings/
          retention-days: 14
          if-no-files-found: ignore

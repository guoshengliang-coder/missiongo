name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Regenerating the interface baselines is a deliberate act: run this workflow
  # by hand, download the `ui-snapshots` artifact, and commit what changed.
  workflow_dispatch:
    inputs:
      update_ui_snapshots:
        description: Rewrite the UI screenshot baselines and upload them
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ui-plan:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      audit: ${{ steps.plan.outputs.audit }}
      visual: ${{ steps.plan.outputs.visual }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Fetch the PR base
        if: github.event_name == 'pull_request'
        # Missing comparison evidence makes the planner choose full UI.
        continue-on-error: true
        env:
          UI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags origin "$UI_BASE_SHA"
      - name: Select UI coverage
        id: plan
        env:
          UI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          UI_UPDATE_SNAPSHOTS: ${{ github.event_name == 'workflow_dispatch' && inputs.update_ui_snapshots }}
        run: node scripts/ui-test-plan.mjs

  linux-node:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run build:types
      - run: npm run test --workspace @missiongo/node-workspace
      - name: Install npm package and verify user service
        run: node scripts/test-node-install.mjs

  web-and-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Reject expanded design exceptions
        if: github.event_name == 'pull_request'
        env:
          DESIGN_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags origin "$DESIGN_BASE_SHA"
          npm run check:styles -- --base "$DESIGN_BASE_SHA"
      - run: npm run check

  # Each shard has its own server, database and account. Keep one worker per
  # runner: tests intentionally exercise account-wide notifications/settings.
  ui-audit:
    needs: ui-plan
    if: needs.ui-plan.outputs.audit == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.ui-plan.outputs.shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run build:types
      - name: Audit interface behavior
        env:
          UI_TEST_PLAN: ${{ needs.ui-plan.outputs.plan }}
          UI_SHARD: ${{ matrix.shard }}
        run: node scripts/run-ui-tests.mjs --kind=audit --shard="$UI_SHARD"
      - uses: actions/upload-artifact@v5
        if: ${{ always() }}
        with:
          name: ui-audit-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Capture against a fresh fixture, independently of the behavior shards.
  ui-visual:
    needs: ui-plan
    if: needs.ui-plan.outputs.visual == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run build:types
      - name: Compare or explicitly update screenshots
        env:
          UI_TEST_PLAN: ${{ needs.ui-plan.outputs.plan }}
        run: node scripts/run-ui-tests.mjs --kind=visual
      - uses: actions/upload-artifact@v5
        if: ${{ always() }}
        with:
          name: ui-snapshots
          path: |
            tests/ui/visual.spec.ts-snapshots/
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Preserve the required check name used by branch/release gates. A failed,
  # cancelled or unexpectedly skipped shard must never produce a green `ui`.
  ui:
    if: ${{ always() }}
    needs: [ui-plan, ui-audit, ui-visual]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - name: Require all UI checks
        env:
          UI_TEST_PLAN: ${{ needs.ui-plan.outputs.plan }}
          UI_PLAN_RESULT: ${{ needs.ui-plan.result }}
          UI_AUDIT_RESULT: ${{ needs.ui-audit.result }}
          UI_VISUAL_RESULT: ${{ needs.ui-visual.result }}
          UI_UPDATE_SNAPSHOTS: ${{ github.event_name == 'workflow_dispatch' && inputs.update_ui_snapshots }}
        run: node scripts/run-ui-tests.mjs --kind=check

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # platform-tools only. The action installs "tools platform-tools" by
      # default, and Google has withdrawn the obsolete "tools" package from the
      # SDK repository, so the default now fails every run before any of this
      # repository's code is reached. Gradle downloads the platform and
      # build-tools it needs by itself.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
      - name: Test SDK and build Android apps
        working-directory: sdks/android-feedback
        run: >-
          ./gradlew
          :missiongo-feedback:testDebugUnitTest
          :missiongo-android-app:testDebugUnitTest
          :sample:assembleDebug
          :missiongo-android-app:assembleDebug

  # The macOS client. Tests run on every change, and the bundle is assembled the
  # same way the publish script does it, so a change that breaks packaging fails
  # here rather than on the machine that happens to publish next.
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - name: Test the macOS client
        run: swift test --package-path apps/macos
      - name: Build the app bundle
        run: ./scripts/build-macos-app.sh

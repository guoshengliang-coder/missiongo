org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# The MissionGo Android version name, and the only place it is declared. Gradle
# reads this file natively and scripts/publish-android-internal.sh parses it, so
# a plain ./gradlew build and a published release always stamp the same version.
missiongoAndroidVersionName=0.1.7
android.useAndroidX=true
kotlin.code.style=official

# Single source of truth for the published SDK version. Override with
# -PmissiongoVersion=<version> for a one-off build. External hosts pin an exact
# version, so this must not be a SNAPSHOT.
missiongoVersion=0.2.1

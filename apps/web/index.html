<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#172033" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MissionGo" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="description" content="MissionGo — 从灵感到交付。" />
    <meta property="og:title" content="MissionGo" />
    <meta property="og:description" content="From idea to shipped." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MissionGo" />
    <meta name="twitter:description" content="From idea to shipped." />
    <title>MissionGo · 从灵感到交付</title>
    <!--
      Resolve light/dark before the first paint, so styles.css needs only one dark palette
      instead of a media query and a duplicate of it. Inline and synchronous on purpose: the
      stylesheet selects on this attribute, so setting it from the bundle would show the wrong
      theme until the bundle ran.

      ?appearance= wins over the system preference. The Android SDK opens the feedback editor
      with it, because a host app's own light/dark setting never reaches prefers-color-scheme.
    -->
    <script>
      (function () {
        var requested = new URLSearchParams(window.location.search).get("appearance");
        var explicit = requested === "light" || requested === "dark" ? requested : null;
        var query = window.matchMedia("(prefers-color-scheme: dark)");
        var apply = function () {
          document.documentElement.dataset.appearance =
            explicit || (query.matches ? "dark" : "light");
        };
        apply();
        if (!explicit) query.addEventListener("change", apply);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Below the build target (see vite.config.ts) the console does not fail loudly: the bundle
      may parse, and the styles it relies on are simply dropped. Say so in plain words instead,
      before the bundle gets a chance to draw a half-styled page. color-mix() is the newest
      feature styles.css depends on, so it stands in for the whole floor. Deliberately ES5 and
      self-styled: nothing else on the page can be assumed to work here.
    -->
    <script>
      (function () {
        var css = window.CSS;
        if (css && css.supports && css.supports("color", "color-mix(in srgb, red, red)")) return;
        window.missiongoUnsupportedBrowser = true;
        var zh = /^zh/i.test(navigator.language || "");
        var android = /Android/i.test(navigator.userAgent);
        var dark = document.documentElement.getAttribute("data-appearance") === "dark";
        var title = zh ? "浏览器版本过低" : "This browser is too old";
        var body = zh
          ? "MissionGo 需要 Chrome / Edge 111、Firefox 113 或 Safari / iOS 16.2 及以上版本。"
          : "MissionGo needs Chrome / Edge 111, Firefox 113 or Safari / iOS 16.2 or later.";
        var hint = android
          ? zh
            ? "请在应用商店更新 Chrome 和 Android System WebView 后重新打开。"
            : "Update Chrome and Android System WebView from your app store, then reopen."
          : zh
            ? "请更新浏览器或系统后重新打开。"
            : "Update your browser or operating system, then reopen.";
        var root = document.getElementById("root");
        root.setAttribute(
          "style",
          "min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;" +
            "font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;" +
            (dark ? "background:#10161f;color:#e8ecef;" : "background:#f3f1eb;color:#172033;")
        );
        root.setAttribute("role", "alert");
        root.innerHTML =
          '<div style="max-width:420px;line-height:1.6">' +
          '<h1 style="margin:0 0 8px;font-size:22px">' + title + "</h1>" +
          '<p style="margin:0 0 6px;font-size:15px">' + body + "</p>" +
          '<p style="margin:0;font-size:15px;opacity:.8">' + hint + "</p>" +
          "</div>";
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
